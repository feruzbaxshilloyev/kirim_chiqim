{% load static %}
<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Sahifasi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(to right, #6b7280, #d1d5db);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 0;
        }
        .container {
            max-width: 800px;
            width: 100%;
        }
        .card {
            border-radius: 1.5rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            background: #ffffff;
            animation: fadeIn 1s ease-in-out;
            padding: 2rem;
        }
        h2 {
            font-weight: bold;
            color: #1f2937;
            animation: slideIn 0.8s ease-out;
        }
        .profile-img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #3b82f6;
            margin-bottom: 1.5rem;
            animation: fadeIn 1.2s ease-in-out;
        }
        .btn {
            border-radius: 0.75rem;
            padding: 0.7rem 1.5rem;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        .btn-primary {
            background: #3b82f6;
            border: none;
        }
        .btn-primary:hover {
            background: #2563eb;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 123, 255, 0.4);
        }
        .btn-outline-secondary {
            border-color: #6b7280;
            color: #6b7280;
        }
        .btn-outline-secondary:hover {
            background: #6b7280;
            color: #ffffff;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        .btn-outline-danger {
            border-color: #dc3545;
            color: #dc3545;
        }
        .btn-outline-danger:hover {
            background: #dc3545;
            color: #ffffff;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(220, 53, 69, 0.4);
        }
        .btn-outline-success {
            border-color: #198754;
            color: #198754;
        }
        .btn-outline-success:hover {
            background: #198754;
            color: #ffffff;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(25, 135, 84, 0.4);
        }
        .btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.6s ease, height 0.6s ease;
        }
        .btn:hover::before {
            width: 200px;
            height: 200px;
        }
        .alert {
            border-radius: 0.75rem;
            animation: slideIn 0.5s ease-out;
        }
        /* Animations */
        @keyframes fadeIn {
            0% { opacity: 0; transform: scale(0.95); }
            100% { opacity: 1; transform: scale(1); }
        }
        @keyframes slideIn {
            0% { opacity: 0; transform: translateY(-20px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        /* Responsive adjustments */
        @media (max-width: 576px) {
            .card {
                padding: 1.5rem;
            }
            h2 {
                font-size: 1.5rem;
            }
            .profile-img {
                width: 100px;
                height: 100px;
            }
            .btn {
                font-size: 0.9rem;
                padding: 0.6rem 1rem;
            }
            .d-flex {
                flex-direction: column;
                align-items: flex-start;
                gap: 1rem;
            }
        }
    </style>
</head>
<body>
<div class="container my-5">
    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">

        <div class="d-flex gap-2">
                        <a href="{% url 'home:home' %}" class="btn btn-outline-success">
                                                        <img src="/media/picture/home.png" alt="logout" width="30">

                        </a>

            <a href="{% url 'kirim:hisobot' %}" class="btn btn-outline-secondary">
                                                                        <img src="/media/picture/back.png" alt="logout" width="30">

            </a>
<a href="{% url 'home:contact' %}" class="btn btn-primary">
                    <img src="/media/picture/mess.png" alt="Gmail" width="30">
                </a>            <a href="{% url 'profil:tahrirlash' %}" class="btn btn-primary">
                            <img src="/media/picture/update.jpg" alt="logout" width="30">

        </a>
            <a href="{% url 'profil:logout' %}" class="btn btn-outline-danger">
                <img src="/media/picture/out.png" alt="logout" width="30">
</a>
        </div>
    </div>

    {% if profil %}
        <div class="card shadow-sm">
             <h2 class="text-primary">Profil</h2>
            <div class="card-body text-center">
                <!-- Profil rasmi -->
<img src="{% if profil.rasm %}{{ profil.rasm.url }}{% else %}{% static 'profil_rasmlari/default.png' %}{% endif %}" alt="Profil rasmi" class="profile-img">                <h4 class="card-title mb-3">{{ request.user.get_full_name }}</h4>
                <p><strong>Foydalanuvchi nomi:</strong> {{ request.user.username }}</p>
                <p><strong>Email:</strong> {{ request.user.email }}</p>
                <p><strong>Telefon:</strong> {{ profil.telefon }}</p>
                <p><strong>Manzil:</strong> {{ profil.manzil }}</p>
            </div>
        </div>
    {% else %}
        <div class="alert alert-warning text-center">
            Profil ma’lumotlari topilmadi!
        </div>
    {% endif %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // Tugmalar va karta uchun puls animatsiyasi
    document.querySelectorAll('.btn, .card, .alert').forEach(item => {
        item.style.animation = 'pulse 1.5s ease-in-out';
        item.addEventListener('animationend', () => {
            item.style.animation = '';
        });
    });
</script>
</body>
</html>
