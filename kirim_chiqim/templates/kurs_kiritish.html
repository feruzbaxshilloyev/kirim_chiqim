{% load i18n %}
<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>Valyuta Kurslarini Kiritish</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="p-4">
<div class="container">
    <h2 class="mb-4">💱 {% trans "Valyuta kurslarini kiriting" %}</h2>
    <form method="post">
        {% csrf_token %}
        {% for field in form %}
            <div class="mb-3">
                {{ field.label_tag }}
                {{ field }}
                {% if field.errors %}
                    <div class="text-danger">{{ field.errors }}</div>
                {% endif %}
            </div>
        {% endfor %}
        <button type="submit" class="btn btn-success">{% trans "Hisoblash" %}</button>
    </form>
    <a href="{% url 'kirim:hisobot' %}" class="btn btn-link mt-3">⬅️ {% trans "Orqaga" %}</a>
</div>
</body>
</html>
